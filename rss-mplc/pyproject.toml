[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rss-mplc"
version = "0.1.0"
description = "Marketplace for the RSS simulation: search, ranking, sponsored-ad auction, hosted campaigns, knowledge, event DB, platform agents."
requires-python = ">=3.11"
dependencies = ["rss-coms", "numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.entry-points."rss.plugins"]
mplc = "mplc.plugin"

# Opt-in contrib group (loaded only via coms.infra.load_contrib() or a contrib: name).
[project.entry-points."rss.contrib"]
mplc = "mplc.contrib._loader"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["test"]
