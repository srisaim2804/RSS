[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rss-slrs"
version = "0.1.0"
description = "Seller simulation for the RSS marketplace: seller sampling, campaign management, bidding/pacing, seller agents, RTB bidder."
requires-python = ">=3.11"
dependencies = ["rss-coms", "numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.entry-points."rss.plugins"]
slrs = "slrs.plugin"

# Opt-in contrib group (loaded only via coms.infra.load_contrib() or a contrib: name).
[project.entry-points."rss.contrib"]
slrs = "slrs.contrib._loader"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["test"]
